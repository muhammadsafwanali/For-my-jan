<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday My Love ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(270deg, #ff4e50, #fc913a, #f9d423, #ff4e50);
    background-size: 800% 800%;
    animation: gradient 15s ease infinite;
    color: white;
    text-align: center;
    overflow-x: hidden;
}

@keyframes gradient {
    0% {background-position:0% 50%}
    50% {background-position:100% 50%}
    100% {background-position:0% 50%}
}

h1 {
    margin-top: 50px;
    font-size: 3em;
}

.typing {
    border-right: 3px solid white;
    width: 0;
    overflow: hidden;
    white-space: nowrap;
    animation: typing 4s steps(40, end) forwards, blink .8s infinite;
}

@keyframes typing {
    from { width: 0 }
    to { width: 100% }
}

@keyframes blink {
    50% { border-color: transparent }
}

button {
    padding: 15px 30px;
    margin: 20px;
    border: none;
    border-radius: 30px;
    background: white;
    color: #ff4e50;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ff4e50;
    color: white;
}

#countdown {
    font-size: 2em;
    margin-top: 20px;
}

.gallery img {
    width: 200px;
    margin: 10px;
    border-radius: 20px;
    transition: transform 0.5s;
}

.gallery img:hover {
    transform: scale(1.1);
}

#letterBox {
    display: none;
    background: rgba(0,0,0,0.8);
    padding: 30px;
    border-radius: 20px;
    width: 80%;
    margin: auto;
}

canvas {
    position: fixed;
    top:0;
    left:0;
    pointer-events:none;
}
</style>
</head>

<body>

<h1 class="typing">Happy Birthday My Beautiful Fiance ❤️</h1>

<div id="countdown"></div>

<button onclick="showSurprise()">🎁 Click For Surprise</button>
<button onclick="showLetter()">💌 Read My Letter</button>

<div id="letterBox">
    <h2>My Love 💖</h2>
    <p>
        Tum meri zindagi ka sabse khoobsurat hissa ho.  
        Har din tumhare saath ek nayi khushi hoti hai.  
        Aaj ke din main dua karta hoon ke tumhari har khwahish poori ho.  
        I Love You Forever ❤️
    </p>
</div>

<h2>📸 Our Beautiful Memories</h2>
<div class="gallery">
    <img src="https://picsum.photos/200?1">
    <img src="https://picsum.photos/200?2">
    <img src="https://picsum.photos/200?3">
</div>

<audio autoplay loop>
    <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mp3">
</audio>

<canvas id="confetti"></canvas>

<script>
// Countdown (Set birthday date here)
var countDownDate = new Date("July 29, 2026 00:00:00").getTime();

var x = setInterval(function() {
  var now = new Date().getTime();
  var distance = countDownDate - now;

  var days = Math.floor(distance / (1000 * 60 * 60 * 24));
  var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  var seconds = Math.floor((distance % (1000 * 60)) / 1000);

  document.getElementById("countdown").innerHTML =
  "🎂 Countdown: " + days + "d " + hours + "h "
  + minutes + "m " + seconds + "s ";

  if (distance < 0) {
    clearInterval(x);
    document.getElementById("countdown").innerHTML = "🎉 It's Her Birthday! 🎉";
  }
}, 1000);

// Surprise Alert
function showSurprise() {
    alert("You are the best thing that ever happened to me ❤️");
    launchConfetti();
}

// Love Letter
function showLetter() {
    document.getElementById("letterBox").style.display = "block";
}

// Confetti
function launchConfetti(){
    var canvas = document.getElementById("confetti");
    var ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    var pieces = [];
    for (var i = 0; i < 150; i++) {
        pieces.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 6 + 4,
            d: Math.random() * 50
        });
    }

    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "white";
        pieces.forEach(function(p){
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI*2, true);
            ctx.fill();
        });
        update();
    }

    function update() {
        pieces.forEach(function(p){
            p.y += Math.cos(p.d) + 1;
            if (p.y > canvas.height) {
                p.y = -10;
                p.x = Math.random() * canvas.width;
            }
        });
    }

    setInterval(draw, 20);
}
</script>

</body>
</html>
